<!DOCTYPE html>
<html lang="en" class="theme-{{ reveal_theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  {% load static %}
  <script src="{% static 'vaultpub/slides-boot.js' %}"></script>
  <link rel="stylesheet" href="{% static 'vaultpub/common.css' %}">
  <link rel="stylesheet" href="{% static 'vaultpub/slides.css' %}">
</head>
<body class="vaultpub-slides" data-return-url="{{ return_url }}" data-return-label="{{ return_label }}">
  <div class="reveal"><div class="slides">{{ slides_html|safe }}</div></div>
  {{ reveal_config|json_script:"vaultpub-slides-config" }}
  {{ slide_settings|json_script:"vaultpub-slide-settings" }}
  <script type="module" src="{% static 'vaultpub/slides.js' %}"></script>
</body>
</html>
